apiVersion: v1
kind: ConfigMap
metadata:
  name: swegen-varisat-depbase-precompile-20260802
  namespace: swegen-pipeline
data:
  Dockerfile: |
    FROM ubuntu:24.04

    # Match the standard production apt rewrite used by validator workers.
    ENV no_proxy=mirrors.tools.huawei.com NO_PROXY=mirrors.tools.huawei.com
    RUN set -eux; \
        for sources_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do \
            if [ -f "$sources_file" ]; then \
                sed -i \
                    -e 's#http://archive.ubuntu.com/ubuntu#http://mirrors.tools.huawei.com/ubuntu#g' \
                    -e 's#https://archive.ubuntu.com/ubuntu#http://mirrors.tools.huawei.com/ubuntu#g' \
                    -e 's#http://security.ubuntu.com/ubuntu#http://mirrors.tools.huawei.com/ubuntu#g' \
                    -e 's#https://security.ubuntu.com/ubuntu#http://mirrors.tools.huawei.com/ubuntu#g' \
                    "$sources_file"; \
            fi; \
        done

    COPY swegen-proxy-ca.crt /tmp/swegen-proxy-ca.crt

    ENV GIT_SSL_CAINFO=/usr/local/share/ca-certificates/swegen-proxy-ca.crt \
        UV_NATIVE_TLS=true \
        NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/swegen-proxy-ca.crt \
        NPM_CONFIG_CAFILE=/usr/local/share/ca-certificates/swegen-proxy-ca.crt \
        NPM_CONFIG_LEGACY_PEER_DEPS=true \
        NPM_CONFIG_FETCH_RETRIES=5 \
        NPM_CONFIG_FETCH_RETRY_FACTOR=2 \
        NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=20000 \
        NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=120000 \
        NPM_CONFIG_MAXSOCKETS=4 \
        YARN_NETWORK_TIMEOUT=600000 \
        YARN_HTTP_TIMEOUT=600000 \
        YARN_NETWORK_CONCURRENCY=4

    RUN apt-get -o Acquire::Retries=5 update && apt-get install -y \
        build-essential \
        ca-certificates \
        curl \
        git \
        patch \
        && mkdir -p /usr/local/share/ca-certificates \
        && cp /tmp/swegen-proxy-ca.crt /usr/local/share/ca-certificates/swegen-proxy-ca.crt \
        && chmod 0644 /usr/local/share/ca-certificates/swegen-proxy-ca.crt \
        && update-ca-certificates \
        && cat /tmp/swegen-proxy-ca.crt >> /etc/ssl/certs/ca-certificates.crt \
        && rm /tmp/swegen-proxy-ca.crt \
        && rm -rf /var/lib/apt/lists/*

    ENV GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt \
        SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
        CARGO_HOME=/root/.cargo \
        RUSTUP_HOME=/root/.rustup \
        PATH=/root/.cargo/bin:${PATH} \
        CARGO_TERM_COLOR=never

    RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain 1.34.2

    WORKDIR /app

    RUN git clone https://github.com/jix/varisat.git src && \
        cd src && \
        (git fetch --depth 1 origin b92d6e87b775ba7d9df20e0f8dfbb8c116dd8d86 || git fetch --depth 1 origin "+refs/pull/55/head:refs/remotes/origin/pr/55") && \
        git checkout --detach FETCH_HEAD && \
        git submodule update --init --recursive

    WORKDIR /app/src

    RUN cargo fetch --locked && \
        cargo test --locked -p varisat --test checker --no-run -j 1
---
