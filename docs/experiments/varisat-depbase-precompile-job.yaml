              /context;
              docker push
              swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com/swesandbox/public/swe-gen/feature-implementation/generated:dep-varisat-b92d6e87-6879d03a5a4b-testbuild-j1
