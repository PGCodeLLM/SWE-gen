apiVersion: v1
kind: ServiceAccount
metadata:
  name: swegen-worker-deployer
  namespace: swegen-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swegen-worker-deployer
  namespace: swegen-pipeline
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swegen-worker-deployer
  namespace: swegen-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swegen-worker-deployer
subjects:
  - kind: ServiceAccount
    name: swegen-worker-deployer
    namespace: swegen-pipeline
