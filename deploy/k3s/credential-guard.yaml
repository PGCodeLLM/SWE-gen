# NOTE: the `swegen-generate-model-credentials` ValidatingAdmissionPolicy (which
# required generate workers to load an allowlisted model-credential Secret as
# their final envFrom and forbade inline model env vars) was removed to support
# dynamic per-endpoint generate pools: the generate-endpoint controller creates
# `swegen-generate-dyn-<slug>` Deployments that carry the endpoint/model/token as
# inline container env. Delete the live policy + binding with:
#   kubectl delete validatingadmissionpolicy swegen-generate-model-credentials
#   kubectl delete validatingadmissionpolicybinding swegen-generate-model-credentials
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swegen-test-worker-deployer-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        request.userInfo.username !=
        'system:serviceaccount:swegen-pipeline:swegen-worker-deployer' ||
        (request.operation == 'DELETE' ? oldObject : object).metadata.name.startsWith('swegen-test-')
      message: >-
        The swegen-worker-deployer identity may only manage Deployments whose
        names start with swegen-test-.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swegen-test-worker-deployer-scope
spec:
  policyName: swegen-test-worker-deployer-scope
  validationActions: [Deny]
