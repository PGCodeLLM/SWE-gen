apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swegen-generate-model-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: generate-worker
      expression: >-
        object.metadata.namespace == 'swegen-pipeline' &&
        has(object.spec.template.metadata.labels) &&
        'swegen.pgcode/stage' in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels['swegen.pgcode/stage'] == 'generate'
  validations:
    - expression: >-
        object.spec.template.spec.containers.exists(container,
          container.name == 'worker' &&
          has(container.envFrom) &&
          container.envFrom.size() > 0 &&
          has(container.envFrom[container.envFrom.size() - 1].secretRef) &&
          container.envFrom[container.envFrom.size() - 1].secretRef.name in [
            'swegen-model-credentials-v2',
            'swegen-model-credentials-pooled-20260801',
            'swegen-model-credentials-gpt53-spark-20260802',
            'swegen-model-credentials-glm52-moedsa-20260802-v2'
          ])
      message: >-
        Generate workers must load an approved immutable central model credential
        Secret as their final envFrom source so it cannot be shadowed.
    - expression: >-
        object.spec.template.spec.containers.all(container,
          container.name != 'worker' ||
          !has(container.env) ||
          container.env.all(variable,
            !(variable.name in [
              'OPENAI_API_KEY', 'OPENAI_BASE_URL', 'OPENAI_MODEL',
              'ANTHROPIC_API_KEY', 'ANTHROPIC_AUTH_TOKEN',
              'ANTHROPIC_BASE_URL', 'ANTHROPIC_MODEL'
            ])))
      message: >-
        Generate workers must not override centrally managed model variables
        with explicit container env entries.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swegen-generate-model-credentials
spec:
  policyName: swegen-generate-model-credentials
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swegen-test-worker-deployer-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        request.userInfo.username !=
        'system:serviceaccount:swegen-pipeline:swegen-worker-deployer' ||
        (request.operation == 'DELETE' ? oldObject : object).metadata.name.startsWith('swegen-test-')
      message: >-
        The swegen-worker-deployer identity may only manage Deployments whose
        names start with swegen-test-.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swegen-test-worker-deployer-scope
spec:
  policyName: swegen-test-worker-deployer-scope
  validationActions: [Deny]
