apiVersion: v1
kind: Service
metadata:
  name: swegen-arc-gateway
  namespace: swegen-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: swegen-arc-gateway
  ports:
    - name: http
      port: 3130
      targetPort: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swegen-arc-gateway
  namespace: swegen-pipeline
spec:
  # Disabled while all production workers use the direct gpt-5.6-sol profile.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-arc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-arc-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 70
      nodeSelector:
        swegen.pgcode/node-ip: 7.244.3.200
      containers:
        - name: gateway
          image: swegen-worker:proxy-noproxy-fix-20260801-0356
          imagePullPolicy: Never
          command: ["python3", "/opt/swegen-arc-gateway.py"]
          env:
            - name: ARC_SG_PROXY
              valueFrom:
                secretKeyRef:
                  name: swegen-runtime-proxy
                  key: HTTPS_PROXY
            - name: ARC_LISTEN_HOST
              value: 0.0.0.0
            - name: ARC_LISTEN_PORT
              value: "3130"
            - name: ARC_POOL_SIZE
              value: "64"
            - name: ARC_MAX_ATTEMPTS
              value: "4"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: gateway
              containerPort: 3130
          readinessProbe:
            httpGet:
              port: gateway
              path: /healthz
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: gateway-script
              mountPath: /opt/swegen-arc-gateway.py
              subPath: swegen-arc-gateway.py
              readOnly: true
        - name: litellm
          image: swegen-worker:arc-pool-litellm-20260801
          imagePullPolicy: Never
          command: ["python3", "-m", "litellm.proxy.proxy_cli"]
          args:
            - --config
            - /etc/litellm/config.yaml
            - --host
            - 0.0.0.0
            - --port
            - "4000"
            - --num_workers
            - "1"
            - --keepalive_timeout
            - "600"
            - --telemetry
            - "False"
          env:
            - name: ARC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swegen-model-credentials-pooled-20260801
                  key: OPENAI_API_KEY
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            - name: no_proxy
              value: 127.0.0.1,localhost
          ports:
            - name: litellm
              containerPort: 4000
          readinessProbe:
            tcpSocket:
              port: litellm
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: gateway-script
          configMap:
            name: swegen-arc-gateway
            defaultMode: 0555
        - name: litellm-config
          configMap:
            name: swegen-arc-litellm
