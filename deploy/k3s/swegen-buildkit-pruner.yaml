apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: swegen-buildkit-pruner
  namespace: swegen-pipeline
  labels:
    app.kubernetes.io/name: swegen-buildkit-pruner
    app.kubernetes.io/component: cache-cleanup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-buildkit-pruner
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep updating healthy nodes when one node is already unavailable under
      # DiskPressure. This DaemonSet is a maintenance helper, not request-serving.
      maxUnavailable: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-buildkit-pruner
        app.kubernetes.io/component: cache-cleanup
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: pruner
          image: swegen-worker:hybrid-buildkit-proxy-skip-20260730
          imagePullPolicy: Never
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              lock_file=/host-run-lock/swegen-buildkit-pruner.lock
              output_file=/tmp/swegen-buildkit-prune.log
              build_slot_dir="${SWEGEN_BUILD_SLOT_DIR}"
              build_gc_lock="${build_slot_dir}/gc.lock"

              sleep "${SWEGEN_BUILDKIT_PRUNE_START_DELAY_SECONDS}"
              while true; do
                printf '%s node=%s buildkit-prune cycle starting\n' "$(date -Iseconds)" "${NODE_NAME}"
                (
                  if ! flock -n 9; then
                    printf '%s node=%s buildkit-prune skipped: node lock is held\n' "$(date -Iseconds)" "${NODE_NAME}"
                    exit 0
                  fi

                  slot_count="$(cat "${build_slot_dir}/count" 2>/dev/null || true)"
                  case "${slot_count}" in
                    ''|*[!0-9]*|0)
                      printf '%s node=%s buildkit-prune skipped: invalid slot count=%s\n' \
                        "$(date -Iseconds)" "${NODE_NAME}" "${slot_count:-missing}"
                      exit 0
                      ;;
                  esac
                  active_slots=0
                  slot_index=0
                  while [ "${slot_index}" -lt "${slot_count}" ]; do
                    slot_file="${build_slot_dir}/${slot_index}"
                    if ! flock -n "${slot_file}" true; then
                      active_slots="$((active_slots + 1))"
                    fi
                    slot_index="$((slot_index + 1))"
                  done
                  if [ "${active_slots}" -gt 0 ]; then
                    printf '%s node=%s buildkit-prune skipped: active build slots=%s/%s\n' \
                      "$(date -Iseconds)" "${NODE_NAME}" "${active_slots}" "${slot_count}"
                    exit 0
                  fi
                  if ! flock -n 8; then
                    printf '%s node=%s buildkit-prune skipped: build admission guard is held\n' \
                      "$(date -Iseconds)" "${NODE_NAME}"
                    exit 0
                  fi

                  printf '%s node=%s cache before prune\n' "$(date -Iseconds)" "${NODE_NAME}"
                  timeout 30 docker system df || true

                  printf '%s node=%s dangling-image cleanup starting\n' \
                    "$(date -Iseconds)" "${NODE_NAME}"
                  # This reaches only the host Docker daemon used by Harbor
                  # builds. K3s worker images live in containerd, whose socket
                  # is intentionally not mounted into this DaemonSet.
                  timeout 120 docker image prune --force || true

                  # Reclaim task images that SWR already holds. Each candidate
                  # is removed only after its manifest is confirmed present in
                  # the registry, so a push that never landed keeps its local
                  # copy. An unreachable registry makes every check fail, which
                  # skips deletion rather than discarding unverified images.
                  if [ "${SWEGEN_SWR_PRUNE_ENABLED}" = "true" ]; then
                    swr_checked=0
                    swr_deleted=0
                    swr_unverified=0
                    swr_deadline="$((
                      $(date -u +%s) + SWEGEN_SWR_PRUNE_BUDGET_SECONDS
                    ))"
                    docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                      | grep -F "${SWEGEN_SWR_HOST}" \
                      | grep -v '<none>' \
                      | sort -u > /tmp/swegen-swr-candidates.txt || true
                    while read -r swr_image; do
                      [ -n "${swr_image}" ] || continue
                      [ "$(date -u +%s)" -lt "${swr_deadline}" ] || break
                      swr_checked="$((swr_checked + 1))"
                      if timeout "${SWEGEN_SWR_MANIFEST_TIMEOUT_SECONDS}" \
                        docker manifest inspect "${swr_image}" >/dev/null 2>&1
                      then
                        if timeout 60 docker rmi "${swr_image}" >/dev/null 2>&1; then
                          swr_deleted="$((swr_deleted + 1))"
                        fi
                      else
                        swr_unverified="$((swr_unverified + 1))"
                      fi
                    done < /tmp/swegen-swr-candidates.txt
                    printf '%s node=%s swr-image cleanup checked=%s deleted=%s unverified_kept=%s\n' \
                      "$(date -Iseconds)" "${NODE_NAME}" "${swr_checked}" \
                      "${swr_deleted}" "${swr_unverified}"
                  fi

                  cutoff_epoch="$((
                    $(date -u +%s) - SWEGEN_DOCKER_CONTAINER_MAX_AGE_SECONDS
                  ))"
                  removed_containers=0
                  for container_id in $(docker ps --all --quiet); do
                    created_at="$(
                      timeout 15 docker inspect --format '{{.Created}}' "${container_id}" \
                        2>/dev/null || true
                    )"
                    [ -n "${created_at}" ] || continue
                    created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null || true)"
                    [ -n "${created_epoch}" ] || continue
                    [ "${created_epoch}" -le "${cutoff_epoch}" ] || continue

                    is_running="$(
                      timeout 15 docker inspect --format '{{.State.Running}}' \
                        "${container_id}" 2>/dev/null || true
                    )"
                    if [ "${is_running}" = "true" ]; then
                      timeout 30 docker stop \
                        --time "${SWEGEN_DOCKER_STOP_TIMEOUT_SECONDS}" \
                        "${container_id}" || true
                    fi
                    if timeout 30 docker rm --force "${container_id}" >/dev/null; then
                      removed_containers="$((removed_containers + 1))"
                    fi
                  done
                  printf '%s node=%s old-container cleanup removed=%s max_age_seconds=%s\n' \
                    "$(date -Iseconds)" "${NODE_NAME}" "${removed_containers}" \
                    "${SWEGEN_DOCKER_CONTAINER_MAX_AGE_SECONDS}"

                  # Removing old containers can expose more unreferenced image layers.
                  timeout 120 docker image prune --force || true

                  prune_status=0
                  timeout "${SWEGEN_BUILDKIT_PRUNE_TIMEOUT_SECONDS}" \
                    docker buildx prune \
                      --builder default \
                      --all \
                      --force \
                      --max-used-space "${SWEGEN_BUILDKIT_MAX_USED_SPACE}" \
                      --reserved-space "${SWEGEN_BUILDKIT_RESERVED_SPACE}" \
                      >"${output_file}" 2>&1 || prune_status=$?

                  tail -n 40 "${output_file}" || true
                  if [ "${prune_status}" -eq 0 ]; then
                    printf '%s node=%s buildkit-prune completed\n' "$(date -Iseconds)" "${NODE_NAME}"
                  else
                    printf '%s node=%s buildkit-prune failed status=%s\n' \
                      "$(date -Iseconds)" "${NODE_NAME}" "${prune_status}"
                  fi

                  printf '%s node=%s cache after prune\n' "$(date -Iseconds)" "${NODE_NAME}"
                  timeout 30 docker system df || true
                ) 8>"${build_gc_lock}" 9>"${lock_file}"

                sleep "${SWEGEN_BUILDKIT_PRUNE_INTERVAL_SECONDS}"
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SWEGEN_BUILDKIT_PRUNE_INTERVAL_SECONDS
              value: "600"
            - name: SWEGEN_BUILDKIT_PRUNE_START_DELAY_SECONDS
              value: "600"
            - name: SWEGEN_BUILDKIT_PRUNE_TIMEOUT_SECONDS
              value: "3600"
            - name: SWEGEN_BUILD_SLOT_DIR
              value: /run/swegen-build-slots
            - name: SWEGEN_DOCKER_CONTAINER_MAX_AGE_SECONDS
              value: "7200"
            - name: SWEGEN_DOCKER_STOP_TIMEOUT_SECONDS
              value: "10"
            - name: SWEGEN_BUILDKIT_MAX_USED_SPACE
              value: 100GB
            - name: SWEGEN_BUILDKIT_RESERVED_SPACE
              value: 20GB
            - name: SWEGEN_SWR_PRUNE_ENABLED
              value: "true"
            - name: SWEGEN_SWR_HOST
              value: swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com
            # Registry round-trips dominate this step, so cap the work per
            # cycle instead of letting it outlast the prune interval.
            - name: SWEGEN_SWR_PRUNE_BUDGET_SECONDS
              value: "300"
            - name: SWEGEN_SWR_MANIFEST_TIMEOUT_SECONDS
              value: "30"
            - name: DOCKER_CONFIG
              value: /swegen-docker
            # The registry auth Secret above is intentionally read-only, but
            # Buildx writes local state under $DOCKER_CONFIG/buildx by default.
            # Keep those files in the Pod's writable ephemeral filesystem.
            - name: BUILDX_CONFIG
              value: /tmp/swegen-buildx
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-run-lock
              mountPath: /host-run-lock
            - name: build-slots
              mountPath: /run/swegen-build-slots
            # Registry credentials for the SWR manifest checks. Read-only: the
            # pruner never writes Docker config.
            - name: swegen-docker-config
              mountPath: /swegen-docker
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: swegen-docker-config
          secret:
            secretName: swegen-docker-config
        - name: host-run-lock
          hostPath:
            path: /run/lock
            type: DirectoryOrCreate
        - name: build-slots
          hostPath:
            path: /data/swegen-k3s/build-slots
            type: DirectoryOrCreate
