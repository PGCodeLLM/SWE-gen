apiVersion: v1
kind: ServiceAccount
metadata:
  name: swegen-generate-endpoint-controller
  namespace: swegen-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swegen-generate-endpoint-controller
  namespace: swegen-pipeline
rules:
  # The controller creates/scales/deletes one Deployment per registered
  # endpoint (swegen-generate-dyn-<slug>). resourceNames cannot be used because
  # the names are dynamic; the controller code hard-guards every mutation to the
  # `swegen-generate-dyn-` prefix so it can never touch a static stage
  # deployment. It also GETs swegen-generate to use as the clone template.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Scaling a Deployment to zero only marks its Pods for deletion; they then run
  # out Generate's 18000s grace. The controller force-deletes an endpoint's Pods
  # (by label swegen.pgcode/endpoint=<slug>) on scale-to-zero and delete.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swegen-generate-endpoint-controller
  namespace: swegen-pipeline
subjects:
  - kind: ServiceAccount
    name: swegen-generate-endpoint-controller
    namespace: swegen-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swegen-generate-endpoint-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swegen-generate-endpoint-controller
  namespace: swegen-pipeline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-generate-endpoint-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-generate-endpoint-controller
    spec:
      serviceAccountName: swegen-generate-endpoint-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        swegen.pgcode/node-ip: 7.244.3.200
      containers:
        - name: controller
          image: swegen-worker:github-clone-auth-20260807
          imagePullPolicy: Never
          command: ["python", "-m", "swegen.pipeline.generate_endpoint_controller"]
          envFrom:
            - configMapRef:
                name: swegen-pipeline-config
            - secretRef:
                name: swegen-database
            # Egress to the registered model endpoints for the health probe goes
            # through the same corporate proxy the workers use.
            - secretRef:
                name: swegen-runtime-proxy
          env:
            - name: SWEGEN_ENDPOINT_NAMESPACE
              value: swegen-pipeline
            - name: SWEGEN_ENDPOINT_POLL_SECONDS
              value: "20"
            - name: SWEGEN_ENDPOINT_PROBE_TIMEOUT_SECONDS
              value: "20"
            # Consecutive unhealthy probes (504/429/5xx/unreachable) before the
            # per-endpoint breaker latches and its Deployment is scaled to zero.
            - name: SWEGEN_ENDPOINT_TRIP_THRESHOLD
              value: "3"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
