apiVersion: apps/v1
kind: Deployment
metadata:
  name: swegen-push
  namespace: swegen-pipeline
spec:
  replicas: 16
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 20%
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-worker
      swegen.pgcode/stage: push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-worker
        swegen.pgcode/stage: push
    spec:
      automountServiceAccountToken: false
      # A push that has not finished within an hour is stuck, not slow, so the
      # grace period stops waiting on it rather than pinning the Pod for the
      # live 7200s.
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        swegen.pgcode/node-ip: 7.244.3.200
      containers:
        - name: worker
          image: swegen-worker:push-remote-digest-fix-20260802-1507
          imagePullPolicy: Never
          args: ["--stage", "push"]
          envFrom:
            - configMapRef:
                name: swegen-pipeline-config
            - secretRef:
                name: swegen-database
            - secretRef:
                name: swegen-runtime-proxy
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DOCKER_BUILDKIT
              value: "1"
            - name: BUILDX_BUILDER
              value: "default"
            - name: COMPOSE_BAKE
              value: "false"
            - name: PATH
              value: /opt/swegen/bin:/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SWEGEN_BUILD_SLOT_DIR
              value: /run/swegen-build-slots
            - name: SWEGEN_REAL_DOCKER
              value: /usr/bin/docker
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
            - name: no_proxy
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
          resources:
            # Measured median 1m CPU / 91Mi across 16 live pods. The old 2-CPU
            # request reserved 32 cores cluster-wide that were never used.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: workspace
              mountPath: /data/swegen-k3s/workspaces
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: build-slots
              mountPath: /run/swegen-build-slots
            - name: swegen-bin
              mountPath: /opt/swegen/bin
              readOnly: true
            - name: private-files
              mountPath: /etc/swegen/swegen.toml
              subPath: swegen.toml
              readOnly: true
            - name: private-files
              mountPath: /etc/swegen/combined-ca.crt
              subPath: combined-ca.crt
              readOnly: true
            - name: docker-config
              mountPath: /root/.docker/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /data/swegen-k3s/workspaces
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: build-slots
          hostPath:
            path: /data/swegen-k3s/build-slots
            type: DirectoryOrCreate
        - name: swegen-bin
          hostPath:
            path: /data/swegen-k3s/bin
            type: DirectoryOrCreate
        - name: private-files
          secret:
            secretName: swegen-private-files
            defaultMode: 0400
        - name: docker-config
          secret:
            secretName: swegen-docker-config
            defaultMode: 0400
