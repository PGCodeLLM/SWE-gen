apiVersion: v1
kind: Namespace
metadata:
  name: swegen-pipeline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swegen-pipeline-config
  namespace: swegen-pipeline
data:
  SWEGEN_PG_HOST: "7.237.95.141"
  SWEGEN_PG_PORT: "5432"
  SWEGEN_PG_USER: root
  SWEGEN_PG_DB: swegen_distributed
  SWEGEN_PG_POOL_MIN: "1"
  SWEGEN_PG_POOL_MAX: "3"
  SWEGEN_LEDGER_BACKEND: postgres
  SWEGEN_WORKSPACE_ROOT: /data/swegen-k3s/workspaces
  SWEGEN_REPO_CACHE_DIR: /data/swegen-k3s/cache/repos
  SWEGEN_CONFIG: /etc/swegen/swegen.toml
  SWEGEN_PROXY_CA_BUNDLE: /etc/swegen/combined-ca.crt
  SSL_CERT_FILE: /etc/swegen/combined-ca.crt
  REQUESTS_CA_BUNDLE: /etc/swegen/combined-ca.crt
  CURL_CA_BUNDLE: /etc/swegen/combined-ca.crt
  GIT_SSL_CAINFO: /etc/swegen/combined-ca.crt
  NODE_EXTRA_CA_CERTS: /etc/swegen/combined-ca.crt
  SWEGEN_CC_TIMEOUT_SECONDS: "10800"
  SWEGEN_GENERATE_TIMEOUT_SECONDS: "14400"
  SWEGEN_GITHUB_API_ATTEMPTS: "8"
  SWEGEN_GITHUB_RETRY_BASE_SECONDS: "10"
  SWEGEN_GITHUB_MAX_WAIT_SECONDS: "300"
  SWEGEN_HARBOR_TIMEOUT_SECONDS: "3600"
  # Total deliveries per stage message: one initial attempt plus one retry.
  # Most stage failures are deterministic, so a third delivery mostly re-burns
  # build capacity that newly enqueued tasks are waiting on.
  SWEGEN_MAX_DELIVERIES: "2"
  # Validator failures are terminal for this pass. Retry/repaired tasks are
  # quarantined and explicitly resubmitted in a later second-pass campaign.
  SWEGEN_VALIDATE_MAX_DELIVERIES: "1"
  SWEGEN_REPAIR_TIMEOUT_SECONDS: "14400"
  SWEGEN_MAX_REPAIR_ATTEMPTS: "3"
  SWEGEN_REWARD_REPAIR_TIMEOUT_SECONDS: "14400"
  SWEGEN_MAX_REWARD_REPAIR_ATTEMPTS: "3"
  SWEGEN_REWARD_ENDPOINT: http://1.95.77.23:3000
  SWEGEN_REWARD_PRIMARY_MODEL: gpt-5.6-sol
  SWEGEN_REWARD_FALLBACK_MODEL: gpt-5.6-sol
  SWEGEN_SWR_HOST: swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com
  SWEGEN_SWR_REPOSITORY: swesandbox/public/swe-gen/feature-implementation/generated
  SWEGEN_SWR_REGISTRY: platform
  SWEGEN_SWR_SUFFIX: _platform
  # Fill node-local BuildKit slots first, then overflow immediately to the
  # remote farm rather than waiting in the local slot wrapper.
  SWEGEN_BUILD_ROUTER_MODE: local_overflow
  SWEGEN_REMOTE_BUILDKIT_URL: http://7.156.122.134:32083
  SWEGEN_REMOTE_BUILDKIT_REGISTRY: swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com
  SWEGEN_REMOTE_BUILDKIT_PULL_REGISTRY_URL: swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com/swesandbox
  SWEGEN_REMOTE_BUILDKIT_REPOSITORY: swesandbox/public/swe-gen/feature-implementation/generated
  SWEGEN_REMOTE_BUILDKIT_CALLBACK_URL: http://callback-server.buildkit-isolated.svc.cluster.local:9000/callback
  SWEGEN_REMOTE_BUILDKIT_BASE_IMAGE_SOURCE_REGISTRY: swr.cn-southwest-2.myhuaweicloud.com
  SWEGEN_REMOTE_BUILDKIT_BASE_IMAGE_MIRROR_REGISTRY: swr-coder-data-platform-wce1sr.swr-pro.myhuaweicloud.com
  SWEGEN_REMOTE_BUILDKIT_PERCENT: "75"
  SWEGEN_REMOTE_BUILDKIT_TIMEOUT_SECONDS: "3600"
  # Pilot repository affinity. Values are backend pools; the client hashes the
  # exact task context within the pool and allows the farm to fall back if the
  # preferred backend is unavailable.
  SWEGEN_REMOTE_BUILDKIT_REPO_BACKEND_MAP: '{"runbox/runbox7":["buildkit-worker-46"]}'
  # A remote timeout/network failure is recorded for a later second pass. It
  # must not re-enter the already saturated node-local BuildKit queue.
  SWEGEN_REMOTE_BUILDKIT_FALLBACK_LOCAL: "false"
  # Build containers inherit the daemon's proxy settings but not NO_PROXY, so
  # apt must reach these hosts directly. mirrors.aliyun.com only answers
  # through the corporate proxy, which returns 504 under build load; the
  # internal mirror serves every suite directly in well under a second.
  SWEGEN_UBUNTU_ARCHIVE_MIRROR: http://mirrors.tools.huawei.com/ubuntu/
  SWEGEN_UBUNTU_CDIMAGE_MIRROR: http://mirrors.tools.huawei.com/ubuntu-cdimage/
  SWEGEN_UBUNTU_CLOUD_IMAGES_MIRROR: http://mirrors.tools.huawei.com/ubuntu-cloud-images/
  SWEGEN_UBUNTU_PORTS_MIRROR: http://mirrors.tools.huawei.com/ubuntu-ports/
  SWEGEN_UBUNTU_RELEASES_MIRROR: http://mirrors.tools.huawei.com/ubuntu-releases/
  SWEGEN_NPM_REGISTRY: https://registry.npmmirror.com/
  SWEGEN_NO_PROXY: ".myhuaweicloud.com,.huaweicloud.com,.huawei.com,127.0.0.1,localhost,7.156.122.134,7.237.95.141,7.244.3.251,7.244.3.200,7.244.3.78,7.244.2.110,7.244.1.209,10.42.0.0/16,10.43.0.0/16,100.*,10.*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swegen-generate
  namespace: swegen-pipeline
spec:
  replicas: 32
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 16
      maxUnavailable: 16
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-worker
      swegen.pgcode/stage: generate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-worker
        swegen.pgcode/stage: generate
    spec:
      automountServiceAccountToken: false
      # Generation is the one stage left on a long grace: it must exceed
      # SWEGEN_GENERATE_TIMEOUT_SECONDS (14400) so an in-flight Claude Code run
      # can finish rather than be killed mid-task.
      terminationGracePeriodSeconds: 18000
      nodeSelector:
        swegen.pgcode/node-ip: 7.244.3.200
      containers:
        - name: worker
          image: swegen-worker:github-auth-fix-20260802-1744
          imagePullPolicy: Never
          args: ["--stage", "generate"]
          envFrom:
            - configMapRef:
                name: swegen-pipeline-config
            - secretRef:
                name: swegen-database
            - secretRef:
                name: swegen-runtime-proxy
            - secretRef:
                name: swegen-model-credentials-glm52-moedsa-20260802-v2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
            - name: no_proxy
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
          resources:
            requests:
              cpu: 500m
              memory: 200Mi
            limits:
              cpu: "16"
              memory: 32Gi
          volumeMounts:
            - name: workspace
              mountPath: /data/swegen-k3s/workspaces
            - name: repo-cache
              mountPath: /data/swegen-k3s/cache
            - name: private-files
              mountPath: /etc/swegen/swegen.toml
              subPath: swegen.toml
              readOnly: true
            - name: private-files
              mountPath: /etc/swegen/combined-ca.crt
              subPath: combined-ca.crt
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /data/swegen-k3s/workspaces
            type: DirectoryOrCreate
        - name: repo-cache
          hostPath:
            path: /data/swegen-k3s/cache
            type: DirectoryOrCreate
        - name: private-files
          secret:
            secretName: swegen-private-files
            defaultMode: 0400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swegen-validate
  namespace: swegen-pipeline
spec:
  replicas: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 20%
  selector:
    matchLabels:
      app.kubernetes.io/name: swegen-worker
      swegen.pgcode/stage: validate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swegen-worker
        swegen.pgcode/stage: validate
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: swegen-worker
              swegen.pgcode/stage: validate
      containers:
        - name: worker
          image: swegen-worker:repo-affinity-runbox-20260802-0049
          imagePullPolicy: Never
          args: ["--stage", "validate"]
          envFrom:
            - configMapRef:
                name: swegen-pipeline-config
            - secretRef:
                name: swegen-database
            - secretRef:
                name: swegen-runtime-proxy
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DOCKER_BUILDKIT
              value: "1"
            - name: BUILDX_BUILDER
              value: "default"
            - name: COMPOSE_BAKE
              value: "false"
            - name: PATH
              value: /opt/swegen/bin:/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SWEGEN_BUILD_SLOT_DIR
              value: /run/swegen-build-slots
            - name: SWEGEN_REAL_DOCKER
              value: /usr/bin/docker
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
            - name: no_proxy
              valueFrom:
                configMapKeyRef:
                  name: swegen-pipeline-config
                  key: SWEGEN_NO_PROXY
          resources:
            # Sized from measured usage across 400 live pods: median 12m CPU /
            # 254Mi, p90 78m / 462Mi. The old 250m/1200Mi reserved roughly 20x
            # the CPU and 5x the memory actually used, which reserved capacity
            # no pod ever consumed. Limits are unchanged, so a heavy task can
            # still burst.
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: workspace
              mountPath: /data/swegen-k3s/workspaces
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: build-slots
              mountPath: /run/swegen-build-slots
            - name: swegen-bin
              mountPath: /opt/swegen/bin
              readOnly: true
            - name: private-files
              mountPath: /etc/swegen/swegen.toml
              subPath: swegen.toml
              readOnly: true
            - name: private-files
              mountPath: /etc/swegen/combined-ca.crt
              subPath: combined-ca.crt
              readOnly: true
            - name: docker-config
              mountPath: /root/.docker/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /data/swegen-k3s/workspaces
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: build-slots
          hostPath:
            path: /data/swegen-k3s/build-slots
            type: DirectoryOrCreate
        - name: swegen-bin
          hostPath:
            path: /data/swegen-k3s/bin
            type: DirectoryOrCreate
        - name: private-files
          secret:
            secretName: swegen-private-files
            defaultMode: 0400
        - name: docker-config
          secret:
            secretName: swegen-docker-config
            defaultMode: 0400
